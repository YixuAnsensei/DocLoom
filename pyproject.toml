[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docloom"
version = "0.2.0"
description = "本地大模型长文档自动化工作台：逐章生成、断点续跑、候选稿修改、联网检索、Web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yixuan" }]
keywords = ["llm", "local-llm", "document-generation", "llama-cpp", "writing"]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# PDF/DOCX 解析与图片抽取（pymupdf 内含 MuPDF C 库，体积较大）
docs = ["pymupdf>=1.24", "python-docx>=1.1"]
# Web UI
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# 一次装齐全部可选功能
all = ["pymupdf>=1.24", "python-docx>=1.1", "fastapi>=0.110", "uvicorn>=0.29"]
# 开发 / 测试
test = ["pytest>=7"]

[project.scripts]
docloom = "docloom.cli:main"

[tool.setuptools.packages.find]
include = ["docloom*"]

[tool.setuptools.package-data]
"docloom.webapp" = ["static/*"]
